name: Test Nginx Configuration

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Test nginx configuration
        run: |
          sudo nginx -t -c "$(pwd)/nginx.conf"
